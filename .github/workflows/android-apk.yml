# Builds a release APK of the Expo app for one backend environment (staging or production) and
# publishes it as a GitHub pre-release so it can be downloaded and installed straight from a phone.
#
# Manual only (Actions tab -> "Android APK" -> Run workflow). Nothing runs on push/PR.
#
# Configuration comes from the GitHub Environment named by the `environment` input
# (Settings -> Environments -> staging | production):
#   variables  API_BASE_URL            required, https://…/v1 (the app talks to this backend only)
#              EAS_PROJECT_ID          optional, Expo push tokens (unset -> push notifications off)
#              GOOGLE_WEB_CLIENT_ID, GOOGLE_IOS_CLIENT_ID, GOOGLE_ANDROID_CLIENT_ID
#                                      optional, "Continue with Google" (hidden without the Android id)
#              MAP_TILE_URL, MAP_TILE_ATTRIBUTION
#                                      optional, custom map tiles (unset -> OpenStreetMap)
#   secret     GOOGLE_SERVICES_JSON_BASE64
#                                      optional, base64 of Firebase google-services.json (FCM, needed
#                                      for push on Android): `base64 -w0 google-services.json`
#   secrets    ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                                      the environment's private release keystore (see
#                                      frontend/README.md "Signing"): required for production,
#                                      optional for staging (falls back to the public debug key)
# They become the app's EXPO_PUBLIC_* build variables (see frontend/.env.example).
#
# What it does (in frontend/): npm ci -> expo prebuild (android) -> ./gradlew assembleRelease
#   - release variant: __DEV__ = false, JS compiled to Hermes bytecode, New Architecture on
#   - signed with the environment's own release keystore. A staging run without one uses the React
#     Native template's PUBLIC debug keystore (testing only: anyone can sign an APK with it that
#     installs over this one); a production run without one fails.
#   - the build job can only read the repository (npm install scripts and Gradle plugins run
#     there); a separate job with write access publishes the finished APK as a pre-release.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Backend environment (GitHub Environment with its API_BASE_URL and other variables)
        type: choice
        default: staging
        options:
          - staging
          - production
      abis:
        description: >-
          CPU architectures. arm64-v8a = every modern phone (fastest build, smallest APK).
          Add armeabi-v7a for old 32-bit phones, x86/x86_64 for emulators.
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - armeabi-v7a,arm64-v8a
          - armeabi-v7a,arm64-v8a,x86,x86_64
      publish_release:
        description: Publish the APK as a GitHub pre-release (downloadable on a phone)
        type: boolean
        default: true

# Read-only by default; only the publish job (which runs no third-party build code) may write.
permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: false # never cancel a build halfway through publishing a release

defaults:
  run:
    shell: bash
    # The Expo app lives in the monorepo's frontend/ folder (the server is in backend/).
    working-directory: frontend

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      apk_name: ${{ steps.apk.outputs.apk_name }}
      apk_size: ${{ steps.apk.outputs.apk_size }}
      app_version: ${{ steps.apk.outputs.app_version }}
      signing: ${{ steps.apk.outputs.signing }}
    # Environment variables and secrets (vars.* / secrets.*) come from this GitHub Environment.
    environment: ${{ inputs.environment }}
    env:
      EXPO_NO_TELEMETRY: 1
      ABIS: ${{ inputs.abis }}
      VERSION_CODE: ${{ github.run_number }}
      # Inlined into the JS bundle by Expo when Gradle bundles it (public values, not secrets).
      EXPO_PUBLIC_APP_ENV: ${{ inputs.environment }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_MAP_TILE_URL: ${{ vars.MAP_TILE_URL }}
      EXPO_PUBLIC_MAP_TILE_ATTRIBUTION: ${{ vars.MAP_TILE_ATTRIBUTION }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # Keep the job token out of .git/config, where install scripts and Gradle plugins could read it.
          persist-credentials: false

      - name: Check the environment's configuration
        # Fails in seconds instead of after a 20-minute build: a staging/production app refuses to
        # start without an https API URL.
        run: |
          echo "Environment: ${EXPO_PUBLIC_APP_ENV}"
          if [ -z "${EXPO_PUBLIC_API_BASE_URL}" ]; then
            echo "::error title=API_BASE_URL is missing::Set the variable API_BASE_URL (https://…/v1) in Settings -> Environments -> ${EXPO_PUBLIC_APP_ENV}."
            exit 1
          fi
          case "${EXPO_PUBLIC_API_BASE_URL}" in
            https://*) ;;
            *)
              echo "::error title=API_BASE_URL must be https::${EXPO_PUBLIC_APP_ENV} builds need an https URL (got ${EXPO_PUBLIC_API_BASE_URL})."
              exit 1
              ;;
          esac
          case "${EXPO_PUBLIC_API_BASE_URL%/}" in
            */v1) ;;
            *) echo "::warning::API_BASE_URL usually ends in /v1 (got ${EXPO_PUBLIC_API_BASE_URL})." ;;
          esac
          echo "API: ${EXPO_PUBLIC_API_BASE_URL}"
          if [ -z "${EXPO_PUBLIC_EAS_PROJECT_ID}" ]; then echo "::warning::EAS_PROJECT_ID is not set: push notifications are off in this build."; fi
          if [ -z "${EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID}" ]; then echo "::warning::GOOGLE_ANDROID_CLIENT_ID is not set: no \"Continue with Google\" in this build."; fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22 # react-native 0.86 needs ^20.19.4 || ^22.13.0 || ^24.3.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17 # RN Gradle plugin pins Kotlin/Java toolchains to 17

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Android SDK packages the build asks for
        # Versions come from React Native's own version catalog, so an SDK upgrade needs no edit here.
        # ubuntu-latest ships platform 36 / build-tools 36.0.0 but a different NDK patch release;
        # AGP would also auto-download missing packages, doing it here is explicit and logged.
        run: |
          TOML=node_modules/react-native/gradle/libs.versions.toml
          get() { sed -nE "s/^$1 *= *\"([^\"]+)\".*/\1/p" "$TOML" | head -1; }
          NDK=$(get ndkVersion); BUILD_TOOLS=$(get buildTools); COMPILE_SDK=$(get compileSdk)
          echo "NDK=$NDK build-tools=$BUILD_TOOLS compileSdk=$COMPILE_SDK"
          test -n "$NDK" && test -n "$BUILD_TOOLS" && test -n "$COMPILE_SDK"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS" \
            "ndk;$NDK" \
            "cmake;3.22.1" > /dev/null

      - name: Stamp versionCode
        # versionCode must grow for Android to treat a new APK as an update; use the run number.
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2) + "\n");
          '
          echo "APP_VERSION=$(node -p 'require("./app.json").expo.version')" >> "$GITHUB_ENV"

      - name: Write google-services.json (Firebase Cloud Messaging)
        # app.config.ts adds it to the native project when GOOGLE_SERVICES_FILE points to it.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: push notifications are off on Android in this build."
            exit 0
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > google-services.json
          node -e '
            const config = JSON.parse(require("fs").readFileSync("google-services.json", "utf8"));
            const app = require("./app.json").expo.android.package;
            const packages = (config.client ?? []).map((client) => client.client_info?.android_client_info?.package_name);
            if (!packages.includes(app)) {
              console.error("google-services.json has no Android app " + app + " (found: " + (packages.join(", ") || "none") + ").");
              process.exit(1);
            }
          '
          echo "GOOGLE_SERVICES_FILE=./google-services.json" >> "$GITHUB_ENV"

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        # The environment's private keystore signs the APK. Without one the template's public debug
        # keystore would sign it: anyone could then build an APK that installs over this one (and
        # keeps its data), so production refuses to build.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            if [ "${EXPO_PUBLIC_APP_ENV}" = "production" ]; then
              echo "::error title=Release keystore missing::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in Settings -> Environments -> production (frontend/README.md, Signing)."
              exit 1
            fi
            echo "::warning::No release keystore for ${EXPO_PUBLIC_APP_ENV}: signed with the PUBLIC debug key (testing only)."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::${name} is missing next to ANDROID_KEYSTORE_BASE64."; exit 1; fi
          done
          KEYSTORE="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$KEYSTORE"
          GRADLE_FILE=android/app/build.gradle
          test -f "$GRADLE_FILE"
          # Gradle reads the passwords from the environment of the build step, never from a file.
          cat >> "$GRADLE_FILE" <<'GRADLE'

          // Added by .github/workflows/android-apk.yml: sign release builds with the environment's keystore.
          android {
              signingConfigs {
                  environmentRelease {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.environmentRelease
                  }
              }
          }
          GRADLE
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING=release" >> "$GITHUB_ENV"

      - name: Tune Gradle memory for this runner
        # 2 vCPU / 7 GB (private repos) vs 4 vCPU / 16 GB (public repos). The Kotlin daemon would
        # otherwise inherit the Gradle heap and the two together can exceed 7 GB.
        run: |
          MEM_GB=$(awk '/MemTotal/ { printf "%d", $2 / 1024 / 1024 }' /proc/meminfo)
          if [ "$MEM_GB" -ge 14 ]; then GRADLE_HEAP=4g; KOTLIN_HEAP=2g; else GRADLE_HEAP=3g; KOTLIN_HEAP=1536m; fi
          echo "RAM ${MEM_GB} GB, $(nproc) CPUs -> Gradle ${GRADLE_HEAP}, Kotlin ${KOTLIN_HEAP}"
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx${GRADLE_HEAP} -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx${KOTLIN_HEAP}"
          } >> android/gradle.properties

      - name: Build release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures="$ABIS" --stacktrace --console=plain

      - name: Verify and rename APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC"
          if [ "$ABIS" = "arm64-v8a" ]; then ABI_LABEL=arm64; else ABI_LABEL=$(echo "$ABIS" | tr ',' '-'); fi
          NAME="Professionals-v${APP_VERSION}-${VERSION_CODE}-${EXPO_PUBLIC_APP_ENV}-${ABI_LABEL}.apk"
          mkdir -p dist && cp "$SRC" "dist/$NAME"
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          "$BT/apksigner" verify --print-certs "dist/$NAME"
          "$BT/aapt2" dump badging "dist/$NAME" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label):"
          if "$BT/zipalign" -c -P 16 4 "dist/$NAME" > /dev/null; then
            echo "Native libraries are 16 KB page aligned."
          else
            echo "::warning::APK is not 16 KB page aligned (only matters on 16 KB page-size devices)."
          fi
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(du -h "dist/$NAME" | cut -f1)" >> "$GITHUB_ENV"
          {
            echo "apk_name=$NAME"
            echo "apk_size=$(du -h "dist/$NAME" | cut -f1)"
            echo "app_version=${APP_VERSION}"
            echo "signing=${SIGNING}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: ${{ always() && env.APK_NAME != '' }}
        run: |
          {
            echo "### Android APK"
            echo ""
            echo "- Environment: \`${EXPO_PUBLIC_APP_ENV}\`, API \`${EXPO_PUBLIC_API_BASE_URL}\`"
            echo "- File: \`${APK_NAME}\` (${APK_SIZE}), ABIs: \`${ABIS}\`, versionCode ${VERSION_CODE}"
            echo "- Signing: ${SIGNING}"
            echo "- Attached to this run as an artifact (zipped)."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish pre-release
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write: it runs no dependency or build code, only downloads the APK.
    permissions:
      contents: write # create the tag + release and upload the APK
    env:
      APK_NAME: ${{ needs.build.outputs.apk_name }}
      APK_SIZE: ${{ needs.build.outputs.apk_size }}
      APP_VERSION: ${{ needs.build.outputs.app_version }}
      SIGNING: ${{ needs.build.outputs.signing }}
      APP_ENV: ${{ inputs.environment }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ABIS: ${{ inputs.abis }}
      VERSION_CODE: ${{ github.run_number }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: dist

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${APP_VERSION}-${VERSION_CODE}-${APP_ENV}"
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then TAG="${TAG}.${GITHUB_RUN_ATTEMPT}"; fi
          if [ "${SIGNING}" = "release" ]; then
            SIGNED="Signed with the ${APP_ENV} release key."
          else
            SIGNED="Signed with the PUBLIC debug key: for testing only, not for the Play Store."
          fi
          NOTES=$(printf '%s\n' \
            "Release APK for **${APP_ENV}** (${API_BASE_URL}) built from \`${GITHUB_SHA::7}\` (${GITHUB_REF_NAME}), ABIs: ${ABIS}, ${APK_SIZE}." \
            "" \
            "Install: open this page on the phone, download **${APK_NAME}**, allow installs from the browser when asked." \
            "${SIGNED}")
          gh release create "$TAG" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Android ${APP_VERSION} (build ${VERSION_CODE}, ${APP_ENV})" \
            --notes "$NOTES" \
            --prerelease
          URL=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "- Download on the phone: ${URL}" >> "$GITHUB_STEP_SUMMARY"
