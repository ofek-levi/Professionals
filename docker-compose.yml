# Local development data stores for the backend: MongoDB as a single-member replica set (the API
# uses transactions, which need a replica set) and Redis. The API and the app run on the host:
#
#   docker compose up -d --wait        # start both (and wait until they are healthy)
#   docker compose down                # stop; add -v to also delete the data volumes
#
# The defaults match backend/.env.example:
#   MONGODB_URI=mongodb://127.0.0.1:27017/?replicaSet=rs0
#   REDIS_URL=redis://127.0.0.1:6379
# If those ports are taken, pick others (MONGO_PORT=27018 REDIS_PORT=6380 docker compose up -d)
# and use them in backend/.env. The replica set advertises 127.0.0.1:<MONGO_PORT>, so it is meant
# to be reached from the host (not from other containers).
name: professionals

services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '${MONGO_PORT:-27017}']
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:${MONGO_PORT:-27017}'
    volumes:
      - mongo-data:/data/db
    # Initiates the replica set on the first check; afterwards it only reports its state.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --port
        - '${MONGO_PORT:-27017}'
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:${MONGO_PORT:-27017}' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  redis-data:
